name: Run FIT Testing (Java release)

on:
  schedule:
    - cron: '0 1 * * SUN'
  workflow_dispatch:
    inputs:
      preset:
        description: FIT presets or preset groups to run, comma-separated. (`fit preset list`)
        required: false
        type: string
        default: op-multi-release
      collect_extra_diagnostics:
        description: Collect additional diagnostics (includes cbcollect, is slower)
        required: false
        type: boolean
        default: true
      channel:
        description: fit-cli install channel ("latest" or "ci").
        required: false
        type: string
        default: ci
      slack_thread:
        description: Slack thread to post a run summary into (e.g. https://couchbase.slack.com/archives/C05LNBVQRE3/p1786376341783169).  Need to invite 'FIT Bot' to channel first.
        required: false
        type: string
        default: '' # For adhoc runs, don't post on Slack by default

permissions:
  id-token: write
  contents: read
  checks: write

jobs:
  fit:
    uses: couchbaselabs/fit-cli/.github/workflows/fit-cli.yaml@main
    with:
      preset: ${{ vars.FIT_CLI_PRESET || inputs.preset || 'op-multi-release' }}
      collect_extra_diagnostics: ${{ inputs.collect_extra_diagnostics == '' && true || inputs.collect_extra_diagnostics }}
      performer: 'java-fit-performer:main'
      channel: ${{ vars.FIT_CLI_CHANNEL || inputs.channel }}
      slack_thread: ${{ inputs.slack_thread || 'https://couchbase.slack.com/archives/C05LNBVQRE3/p1786447688819499' }}
