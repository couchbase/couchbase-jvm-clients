name: Smoke Test

on:
  pull_request:
  push:
    branches:
      - 'master'
      - '[0-9]+.[0-9]+.x' # release branches

jobs:
  test:
    name: Test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # Java 8 is for running tests. Other version is for building the SDK.
          java-version: |
            8
            17
          cache: 'maven'

      - name: Run tests
        timeout-minutes: 40
        run: |
          make deps-only
          ./mvnw verify -Pfit --batch-mode -Dmaven.test.failure.ignore=true -Dmaven.javadoc.skip=true -Djvm=${JAVA_HOME_8_X64}/bin/java

      - name: Remove artifacts from Maven repo so they're not cached
        run: rm -rfv ~/.m2/repository/com/couchbase/client/

      - uses: actions/upload-artifact@v7
        with:
          name: junit-results
          path: '**/surefire-reports/**'
          retention-days: 7

      - name: Publish test results
        run: |
          curl https://raw.githubusercontent.com/couchbaselabs/junit-markdown/refs/heads/main/JunitMarkdown.java --output ${{ runner.temp }}/JunitMarkdown.java
          java ${{ runner.temp }}/JunitMarkdown.java . >> $GITHUB_STEP_SUMMARY
